# Production Docker Compose — deploy as a Coolify Service Stack.
# Coolify auto-detects ${VAR_NAME} syntax and creates UI fields for each.
# Do NOT expose ports here — Coolify's Traefik handles external routing.

services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/trebeljahr/streaks-server:main}
    pull_policy: always
    environment:
      PORT: "5276"
      # Coolify-managed MongoDB on the shared `coolify` network (the app has
      # "Connect to Predefined Network" on). No in-stack datastore: a
      # Docker Image app has no compose to hold one. Redis is unused.
      MONGODB_URI: ${MONGODB_URI}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_LOG_LINKS: ${AUTH_LOG_LINKS:-false}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LISTMONK_URL: ${LISTMONK_URL:-}
      LISTMONK_API_USER: ${LISTMONK_API_USER:-}
      LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN:-}
      LISTMONK_FROM_EMAIL: ${LISTMONK_FROM_EMAIL:-}
      LISTMONK_FROM: ${LISTMONK_FROM:-}
      LISTMONK_REPLY_TO: ${LISTMONK_REPLY_TO:-rico@trebeljahr.com}
      LISTMONK_LIVE_LIST_ID: ${LISTMONK_LIVE_LIST_ID:-}
      LISTMONK_TEST_LIST_ID: ${LISTMONK_TEST_LIST_ID:-}
      LISTMONK_TX_TEMPLATE_ID: ${LISTMONK_TX_TEMPLATE_ID:-}
      LISTMONK_CAMPAIGN_TEMPLATE_ID: ${LISTMONK_CAMPAIGN_TEMPLATE_ID:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-assets}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE:-ghcr.io/trebeljahr/streaks-client:main}
    pull_policy: always
    environment:
      # Pin client port — Coolify's app-level PORT (set for the server)
      # would otherwise bleed into every service.
      PORT: "6999"
      HOSTNAME: "0.0.0.0"
      # Deliberately NO NEXT_PUBLIC_* here: Next.js inlines those into
      # the browser bundle when the image is BUILT, so runtime env on
      # this prebuilt container cannot affect them. They are passed as
      # Docker build args in .github/workflows/build-and-deploy.yml.
    restart: unless-stopped

