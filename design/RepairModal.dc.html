<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Outfit:wght@300;400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; background: #16141F; }
    a { color: #8B7FD4; text-decoration: none; } a:hover { color: #C9A5F0; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #16141F; color: #EDE9F5; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative">

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 34px 20px 0 20px; opacity: 0.28">
    <div style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 20px; color: #EDE9F5">Piano</div>
    <div style="height: 108px; background: #1E1B29; border: 1px solid #2E2A3C; border-radius: 18px"></div>
    <div style="height: 148px; background: #1E1B29; border: 1px solid #2E2A3C; border-radius: 18px"></div>
    <div style="height: 190px; background: #1E1B29; border: 1px solid #2E2A3C; border-radius: 18px"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(11, 10, 16, 0.62)"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 22px; background: #201C2C; border-top: 1px solid #35304A; border-radius: 26px 26px 0 0; padding: 14px 20px 34px 20px">

    <div style="width: 40px; height: 4px; border-radius: 999px; background: #3A3550; align-self: center"></div>

    <div style="display: flex; flex-direction: column; gap: 9px">
      <div style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #635C7A">TUESDAY 26 AUGUST</div>
      <div style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 25px; line-height: 1.16; letter-spacing: -0.02em; color: #EDE9F5; text-wrap: pretty">Tuesday is blank.</div>
      <div style="font-size: 14.5px; font-weight: 300; color: #9C95B4; text-wrap: pretty">You can spend a repair token to fill it in and carry the 12-day streak through. Entirely up to you.</div>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; background: rgba(224, 164, 88, 0.07); border: 1px solid rgba(224, 164, 88, 0.26); border-radius: 16px; padding: 15px">
      <div style="display: flex; gap: 5px">
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #E0A458"></div>
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #E0A458"></div>
        <div style="width: 12px; height: 12px; border-radius: 50%; border: 1px solid #4A4360"></div>
      </div>
      <div style="flex-grow: 1; font-size: 13.5px; font-weight: 300; color: #9C95B4">2 in the bank. One more after 3 credited days.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="height: 54px; border-radius: 15px; background: #E0A458; display: flex; align-items: center; justify-content: center; gap: 9px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16141F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.5A9 9 0 1 1 9 3.6"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        <div style="font-size: 15px; font-weight: 600; color: #16141F">Fill Tuesday in</div>
      </div>
      <div style="height: 54px; border-radius: 15px; border: 1px solid #35304A; display: flex; align-items: center; justify-content: center">
        <div style="font-size: 15px; font-weight: 500; color: #C4BDD8">Leave it blank</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 0 2px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#635C7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <div style="font-size: 12.5px; font-weight: 300; color: #7E7796; text-wrap: pretty">Leaving it blank is fine too. Momentum moves by about two points.</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
