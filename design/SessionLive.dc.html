<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Outfit:wght@300;400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; background: #16141F; }
    a { color: #8B7FD4; text-decoration: none; } a:hover { color: #C9A5F0; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: radial-gradient(120% 55% at 50% 34%, #241F38 0%, #1A1726 45%, #16141F 100%); color: #EDE9F5; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 34px 20px 0 20px">
    <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2E2A3C; display: flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9C95B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <div style="font-size: 15px; font-weight: 500; color: #EDE9F5">Piano</div>
      <div style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; color: #635C7A">SCALES &amp; ARPEGGIOS</div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2E2A3C; display: flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9C95B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="3.5"></circle></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 20px">

    <div style="position: relative; width: 264px; height: 264px">
      <svg width="264" height="264" viewBox="0 0 264 264" style="display: block">
        <circle cx="132" cy="132" r="120" fill="none" stroke="#282338" stroke-width="7"></circle>
        <circle cx="132" cy="132" r="120" fill="none" stroke="#C9A5F0" stroke-width="7" stroke-linecap="round" stroke-dasharray="232.2 754.0" transform="rotate(-90 132 132)" opacity="0.28"></circle>
        <circle cx="132" cy="132" r="120" fill="none" stroke="#C9A5F0" stroke-width="4" stroke-linecap="round" stroke-dasharray="232.2 754.0" transform="rotate(-90 132 132)"></circle>
        <circle cx="189.8" cy="26.9" r="4.5" fill="#16141F" stroke="#6FBFA8" stroke-width="2.5"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
        <div style="font-family: 'DM Mono', monospace; font-weight: 500; font-size: 54px; letter-spacing: -0.02em; color: #EDE9F5; line-height: 1">07:42</div>
        <div style="font-size: 12.5px; font-weight: 300; color: #7E7796">counting up &middot; aiming at 25</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; background: rgba(111, 191, 168, 0.10); border: 1px solid rgba(111, 191, 168, 0.32); border-radius: 999px; padding: 9px 16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6FBFA8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <div style="font-size: 13.5px; font-weight: 500; color: #8FD4BF">Day secured at 2:00</div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 11px; background: #1E1B29; border: 1px solid #2A2638; border-radius: 16px; padding: 14px">
      <div style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #635C7A">IN THIS ROOM</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 24px; height: 24px; border-radius: 50%; background: #7FA8D4; font-size: 10.5px; font-weight: 600; color: #16141F; display: flex; align-items: center; justify-content: center">M</div>
        <div style="flex-grow: 1; font-size: 13px; font-weight: 300; color: #9C95B4">Mara &middot; Writing</div>
        <div style="font-family: 'DM Mono', monospace; font-size: 12.5px; color: #7E7796">18:04</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 24px; height: 24px; border-radius: 50%; background: #6FBFA8; font-size: 10.5px; font-weight: 600; color: #16141F; display: flex; align-items: center; justify-content: center">J</div>
        <div style="flex-grow: 1; font-size: 13px; font-weight: 300; color: #9C95B4">Jonas &middot; Learning</div>
        <div style="font-family: 'DM Mono', monospace; font-size: 12.5px; color: #7E7796">04:51</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 24px; height: 24px; border-radius: 50%; background: #C9A5F0; font-size: 10.5px; font-weight: 600; color: #16141F; display: flex; align-items: center; justify-content: center">A</div>
        <div style="flex-grow: 1; font-size: 13px; font-weight: 300; color: #9C95B4">Ada &middot; Drawing</div>
        <div style="font-family: 'DM Mono', monospace; font-size: 12.5px; color: #7E7796">31:20</div>
      </div>
    </div>

  </div>

  <div style="display: flex; gap: 12px; padding: 0 20px 34px 20px">
    <div style="flex-grow: 1; height: 54px; border-radius: 15px; border: 1px solid #35304A; display: flex; align-items: center; justify-content: center; gap: 9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#9C95B4"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
      <div style="font-size: 15px; font-weight: 500; color: #C4BDD8">Pause</div>
    </div>
    <div style="flex-grow: 1; height: 54px; border-radius: 15px; background: #8B7FD4; display: flex; align-items: center; justify-content: center">
      <div style="font-size: 15px; font-weight: 600; color: #16141F">Finish</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
