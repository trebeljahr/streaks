<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Outfit:wght@300;400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; background: #16141F; }
    a { color: #8B7FD4; text-decoration: none; } a:hover { color: #C9A5F0; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: radial-gradient(110% 45% at 50% 12%, #2A2340 0%, #1B1827 48%, #16141F 100%); color: #EDE9F5; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 60px 20px 0 20px">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #8B7FD4">PIANO &middot; 24 MIN</div>
      <div style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.12; letter-spacing: -0.02em; color: #EDE9F5">That&#39;s twelve days in a row.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #635C7A">HOW WAS IT?</div>
      <div style="display: flex; gap: 10px">
        <div style="flex-grow: 1; aspect-ratio: 1; border-radius: 14px; border: 1px solid #2E2A3C; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#635C7A" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 15.5c1-1.2 5-1.2 7 0"></path><line x1="9" y1="9.5" x2="9.01" y2="9.5"></line><line x1="15" y1="9.5" x2="15.01" y2="9.5"></line></svg>
        </div>
        <div style="flex-grow: 1; aspect-ratio: 1; border-radius: 14px; border: 1px solid #2E2A3C; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#635C7A" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><line x1="8.5" y1="15" x2="15.5" y2="15"></line><line x1="9" y1="9.5" x2="9.01" y2="9.5"></line><line x1="15" y1="9.5" x2="15.01" y2="9.5"></line></svg>
        </div>
        <div style="flex-grow: 1; aspect-ratio: 1; border-radius: 14px; border: 1px solid #2E2A3C; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#635C7A" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 14c1 1.2 5 1.2 7 0"></path><line x1="9" y1="9.5" x2="9.01" y2="9.5"></line><line x1="15" y1="9.5" x2="15.01" y2="9.5"></line></svg>
        </div>
        <div style="flex-grow: 1; aspect-ratio: 1; border-radius: 14px; border: 1.5px solid #8B7FD4; background: rgba(139, 127, 212, 0.14); display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A5F0" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 13.5c1.2 1.8 6.8 1.8 8 0"></path><line x1="9" y1="9.5" x2="9.01" y2="9.5"></line><line x1="15" y1="9.5" x2="15.01" y2="9.5"></line></svg>
        </div>
        <div style="flex-grow: 1; aspect-ratio: 1; border-radius: 14px; border: 1px solid #2E2A3C; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#635C7A" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M7.6 12.8h8.8a4.4 4.4 0 0 1-8.8 0z"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px; background: #1E1B29; border: 1px solid #2E2A3C; border-radius: 16px; padding: 16px">
        <div style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #635C7A">STREAK</div>
        <div style="display: flex; align-items: baseline; gap: 7px">
          <div style="font-family: 'DM Mono', monospace; font-size: 15px; color: #4E4866; text-decoration: line-through">11</div>
          <div style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em; color: #C9A5F0; line-height: 1">12</div>
        </div>
        <div style="font-size: 12px; font-weight: 300; color: #9C95B4">days</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px; background: #1E1B29; border: 1px solid #2E2A3C; border-radius: 16px; padding: 16px">
        <div style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #635C7A">MOMENTUM</div>
        <div style="display: flex; align-items: baseline; gap: 7px">
          <div style="font-family: 'DM Mono', monospace; font-size: 15px; color: #4E4866; text-decoration: line-through">62</div>
          <div style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em; color: #C9A5F0; line-height: 1">66</div>
        </div>
        <div style="font-size: 12px; font-weight: 300; color: #9C95B4">of 100</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; background: rgba(224, 164, 88, 0.08); border: 1px solid rgba(224, 164, 88, 0.28); border-radius: 16px; padding: 15px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E0A458" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.5A9 9 0 1 1 9 3.6"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 14.5px; font-weight: 500; color: #EDCFA6">Repair token earned</div>
        <div style="font-size: 12.5px; font-weight: 300; color: #9C95B4">Three in the bank. Enough for a rough week.</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; border: 1px dashed #322D42; border-radius: 14px; padding: 14px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#635C7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      <div style="font-size: 13.5px; font-weight: 300; color: #7E7796">Add a note (optional)</div>
    </div>

  </div>

  <div style="padding: 0 20px 34px 20px">
    <div style="height: 54px; border-radius: 15px; background: #8B7FD4; display: flex; align-items: center; justify-content: center">
      <div style="font-size: 15px; font-weight: 600; color: #16141F">Done</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
