<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Outfit:wght@300;400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; background: #16141F; }
    a { color: #8B7FD4; text-decoration: none; } a:hover { color: #C9A5F0; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #16141F; color: #EDE9F5; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 56px 20px 0 20px">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #635C7A">STEP 1 OF 2</div>
      <div style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 27px; line-height: 1.14; letter-spacing: -0.02em; color: #EDE9F5; text-wrap: pretty">What do you want to practice?</div>
      <div style="font-size: 14px; font-weight: 300; color: #9C95B4">Pick a few. Nothing here is permanent.</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

      <div style="display: flex; flex-direction: column; gap: 12px; background: rgba(127, 168, 212, 0.10); border: 1.5px solid #7FA8D4; border-radius: 16px; padding: 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FA8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        <div style="font-size: 15px; font-weight: 500; color: #EDE9F5">Writing</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; background: rgba(139, 127, 212, 0.10); border: 1.5px solid #8B7FD4; border-radius: 16px; padding: 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B7FD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
        <div style="font-size: 15px; font-weight: 500; color: #EDE9F5">Finishing things</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; background: rgba(111, 191, 168, 0.10); border: 1.5px solid #6FBFA8; border-radius: 16px; padding: 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6FBFA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H20v14H5.5A2.5 2.5 0 0 0 3 20.5z"></path><line x1="8" y1="8.5" x2="15" y2="8.5"></line></svg>
        <div style="font-size: 15px; font-weight: 500; color: #EDE9F5">Learning</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; background: rgba(201, 165, 240, 0.10); border: 1.5px solid #C9A5F0; border-radius: 16px; padding: 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9A5F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="10" rx="1.6"></rect><line x1="7" y1="7" x2="7" y2="13"></line><line x1="12" y1="7" x2="12" y2="13"></line><line x1="17" y1="7" x2="17" y2="13"></line></svg>
        <div style="font-size: 15px; font-weight: 500; color: #EDE9F5">Piano</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; background: #1E1B29; border: 1px solid #2E2A3C; border-radius: 16px; padding: 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7E7796" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path></svg>
        <div style="font-size: 15px; font-weight: 500; color: #9C95B4">Drawing</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; border: 1px dashed #322D42; border-radius: 16px; padding: 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#635C7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <div style="font-size: 15px; font-weight: 500; color: #7E7796">Something else</div>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 13px; background: #1E1B29; border: 1px solid #2E2A3C; border-radius: 16px; padding: 17px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 15px; font-weight: 500; color: #EDE9F5">How little still counts?</div>
        <div style="font-size: 12.5px; font-weight: 300; color: #9C95B4; text-wrap: pretty">Hit this and the day is yours. Keep it embarrassingly small.</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 44px; height: 44px; border-radius: 13px; border: 1px solid #35304A; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C95B4" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px">
          <div style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em; color: #C9A5F0; line-height: 1">2</div>
          <div style="font-size: 14px; font-weight: 300; color: #9C95B4">minutes</div>
        </div>
        <div style="width: 44px; height: 44px; border-radius: 13px; border: 1px solid #35304A; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C95B4" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
      </div>
    </div>

  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 0 20px 34px 20px">
    <div style="height: 54px; border-radius: 15px; background: #8B7FD4; display: flex; align-items: center; justify-content: center">
      <div style="font-size: 15px; font-weight: 600; color: #16141F">Continue with 4</div>
    </div>
    <div style="font-size: 12.5px; font-weight: 300; color: #635C7A; text-align: center">No targets to set. No schedule to build.</div>
  </div>

</div>
</x-dc>
</body>
</html>
