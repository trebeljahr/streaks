name: build-and-deploy

on:
  push:
    branches: [main]

concurrency:
  group: main-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prerendering initializes the auth client and requires an absolute URL.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5006
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:unit
      - run: pnpm run test:client

  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5006
    services:
      mongo-e2e:
        image: mongo:7
        ports:
          - 27018:27017
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Local S3 for the server's storage service. Docker Hub no longer
      # serves minio/minio or minio/mc; this is the same image and tag as
      # e2e/start-server.sh. `S3_BUCKET` creates the bucket on startup, and
      # with no credentials configured SeaweedFS accepts any signature.
      # Endpoint, bucket and credentials come from playwright.config.ts.
      - name: Start SeaweedFS
        run: |
          docker run -d --name e2e-seaweedfs -p 9002:8333 \
            -e S3_BUCKET=streaks-e2e \
            --tmpfs /data chrislusf/seaweedfs:4.47
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9002/streaks-e2e && exit 0
            sleep 1
          done
          echo "SeaweedFS did not serve bucket streaks-e2e within 60s" >&2
          docker logs e2e-seaweedfs >&2
          exit 1

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27018/streaks-e2e
          REDIS_URL: redis://127.0.0.1:6380
          BETTER_AUTH_SECRET: e2e-test-secret
          BETTER_AUTH_URL: http://127.0.0.1:5006
          FRONTEND_URL: http://127.0.0.1:3001

  build-server:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          # Reported as /api/health .version; deploy-client waits for it.
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-server:main
            ghcr.io/${{ github.repository }}-server:${{ github.sha }}

  # The client is a static export served by the Cloudflare Worker
  # streaks-client (hatchkit clientHost "cloudflare"). This job uploads a
  # Worker version and activates nothing; deploy-client switches to it
  # once the server reports this commit.
  build-client:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    env:
      SITE_URL: https://streaks.trebeljahr.com
      WRANGLER: wrangler@4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* are inlined into the bundle at build time.
      - name: Build the static client
        env:
          NEXT_FILE_EXPORT: "1"
          NEXT_PUBLIC_API_URL: https://streaks.trebeljahr.com
          NEXT_PUBLIC_WS_URL: wss://streaks.trebeljahr.com
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: "${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}"
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: "${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}"
          NEXT_PUBLIC_SENTRY_DSN: "${{ vars.NEXT_PUBLIC_SENTRY_DSN }}"
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm --filter @starter/shared run build
          pnpm --filter @starter/client run build
          test -n "$NEXT_PUBLIC_API_URL" || { echo "::error::NEXT_PUBLIC_API_URL is empty"; exit 1; }
          # Set and still never inlined (a renamed variable, a server-only
          # reference) builds green and talks to the wrong API.
          grep -rqF "$NEXT_PUBLIC_API_URL" packages/client/out/_next/static \
            || { echo "::error::NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL never reached the bundle"; exit 1; }
          # A relative asset prefix breaks every nested route's chunks.
          if grep -rlF '"./_next' packages/client/out --include='*.html' | grep -q .; then
            echo "::error::exported HTML references ./_next — drop the relative assetPrefix"; exit 1
          fi
          printf '{"commit":"%s","apiUrl":"%s"}\n' "$COMMIT_SHA" "$NEXT_PUBLIC_API_URL" > packages/client/out/version.json

      # A Worker version serves only its own files. Carry the last two
      # releases' hashed files so tabs opened before this deploy keep
      # loading their chunks.
      - name: Carry earlier releases' hashed files
        run: node scripts/carry-static.mjs --site "$SITE_URL" --out packages/client/out

      - name: Upload a new Worker version (not live yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          set -euo pipefail
          pnpm dlx "$WRANGLER" versions upload --tag "$GITHUB_SHA" --message "$GITHUB_SHA"
          id=$(node -e 'const rows=require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n").map((l)=>JSON.parse(l));const row=rows.find((r)=>r.type==="version-upload");if(!row?.version_id)process.exit(1);console.log(row.version_id)' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
          echo "Uploaded Worker version $id (not live yet)"

  # Single deploy job — Hatchkit registers ONE Coolify app per project
  # (a single dockercompose pulling both ghcr.io/<owner>/<repo>-server
  # and -client images), so there is exactly ONE deploy trigger to fire
  # once both image builds succeed. Earlier revisions of this workflow
  # had per-build deploy steps reading per-surface secret names
  # (COOLIFY_SERVER_RESOURCE_UUID, COOLIFY_CLIENT_RESOURCE_UUID) that
  # Hatchkit never sets — both steps silently no-opped and Coolify
  # never got told to redeploy. The secret names below match what
  # `hatchkit adopt` and `setCoolifyDeploySecrets` push.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    outputs:
      server_deployed: ${{ steps.server-deployed.outputs.deployed }}
    # This gates the CI webhook. Verify the legacy Compose app's live watch
    # path is .hatchkit/deploy-webhook before the first push; Auto Deploy
    # can remain enabled when ordinary source changes do not match it.
    # Enable this variable after image resources and secrets are ready.
    if: vars.STREAKS_IMAGE_ROLLOUT_READY == 'true'
    steps:
      # Point `:live` at the images this run built. Every Coolify app
      # pulls `:live` (hatchkit sets that when it wires the app), so
      # this is what decides which build the deploy below starts — the
      # immutable `:<sha>` tag, re-published under the name the apps
      # read. It uses this job's own GITHUB_TOKEN (`packages: write`),
      # which can write this repository's packages and nothing else; no
      # Coolify credential is involved.
      #
      # A rollback is the same step with an older sha.
      - name: Promote this commit's images to :live
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for half in server client; do
            image="ghcr.io/${{ github.repository }}-$half"
            if ! docker buildx imagetools inspect "$image:${{ github.sha }}" >/dev/null 2>&1; then
              echo "no $image:${{ github.sha }} — this project has no $half image"
              continue
            fi
            docker buildx imagetools create --tag "$image:live" "$image:${{ github.sha }}"
            echo "promoted $image:${{ github.sha }} to :live"
          done

      # Tell Coolify to deploy. There is no Coolify API token here: each
      # app has its own webhook secret (hatchkit mints it), and a `push`
      # payload signed with it queues a deploy of that one app — it can
      # read nothing and touch no other app. The payload names
      # `.hatchkit/deploy-webhook`, the app's only watch path, so an ordinary
      # push that reaches Coolify through its GitHub App never deploys a
      # build that does not exist yet; only this step does.
      #
      # Which apps: COOLIFY_RESOURCE_UUID for a single-app project, or
      # COOLIFY_SERVER_/COOLIFY_CLIENT_RESOURCE_UUID for a split one.
      # hatchkit sets one set and clears the other.
      - name: Deploy via signed Coolify webhook
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_SERVER_DEPLOY_SECRET: ${{ secrets.COOLIFY_SERVER_DEPLOY_SECRET }}
          COOLIFY_SERVER_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_SERVER_DEPLOY_REPOSITORY }}
          COOLIFY_SERVER_DEPLOY_BRANCH: ${{ secrets.COOLIFY_SERVER_DEPLOY_BRANCH }}
          COOLIFY_CLIENT_RESOURCE_UUID: ${{ secrets.COOLIFY_CLIENT_RESOURCE_UUID }}
          COOLIFY_CLIENT_DEPLOY_SECRET: ${{ secrets.COOLIFY_CLIENT_DEPLOY_SECRET }}
          COOLIFY_CLIENT_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_CLIENT_DEPLOY_REPOSITORY }}
          COOLIFY_CLIENT_DEPLOY_BRANCH: ${{ secrets.COOLIFY_CLIENT_DEPLOY_BRANCH }}
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -euo pipefail
          deployed=0
          deploy() { # label, secret-name prefix
            local uuid_var="${2}RESOURCE_UUID" secret_var="${2}DEPLOY_SECRET"
            local repo_var="${2}DEPLOY_REPOSITORY" branch_var="${2}DEPLOY_BRANCH"
            local uuid="${!uuid_var:-}" secret="${!secret_var:-}"
            local repo="${!repo_var:-}" branch="${!branch_var:-}"
            [ -n "$uuid" ] || return 0
            if [ -z "$secret" ] || [ -z "$repo" ] || [ -z "$branch" ]; then
              echo "::error::${2}DEPLOY_SECRET/_REPOSITORY/_BRANCH are not set — run \`hatchkit sync\` or \`hatchkit secrets isolate\`."
              exit 1
            fi
            local body sig answer
            body=$(jq -cn --arg ref "refs/heads/$branch" --arg sha "$GITHUB_SHA" --arg repo "$repo" \
              '{ref: $ref, after: $sha, repository: {full_name: $repo}, commits: [{id: $sha, added: [], removed: [], modified: [".hatchkit/deploy-webhook"]}]}')
            sig=$(printf '%s' "$body" | HOOK_SECRET="$secret" node -e \
              'process.stdout.write(require("node:crypto").createHmac("sha256", process.env.HOOK_SECRET).update(require("node:fs").readFileSync(0)).digest("hex"))')
            answer=$(curl -fsS -X POST "$COOLIFY_BASE_URL/webhooks/source/github/events/manual" \
              -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
              -H "X-Hub-Signature-256: sha256=$sig" --data-binary "$body")
            if printf '%s' "$answer" | jq -e --arg uuid "$uuid" \
              'type == "array" and any(.[]; .application_uuid == $uuid and .status == "success")' \
              >/dev/null 2>&1; then
              echo "deploy queued for the $1 app ($uuid)"
              deployed=$((deployed + 1))
            else
              # Other apps on the same repo answer "Invalid signature.";
              # they are left out so a public log names only this one.
              detail=$(printf '%s' "$answer" | jq -c '[.[]? | select(.message != "Invalid signature.") | {status, message}]' 2>/dev/null || printf '%s' "$answer" | head -c 200)
              echo "::error::Coolify did not queue a deploy of the $1 app: $detail"
              exit 1
            fi
          }
          deploy app COOLIFY_
          deploy server COOLIFY_SERVER_
          if [ "$deployed" -eq 0 ]; then
            echo "::error::COOLIFY_BASE_URL is set but no COOLIFY_*RESOURCE_UUID is — nothing was deployed."
            exit 1
          fi

      - name: Record that the server half was deployed
        id: server-deployed
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
        if: env.COOLIFY_BASE_URL != ''
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  # Server first, then the client: deploy-client waits until the server
  # reports this commit, switches the Worker in one step, and checks
  # /version.json.
  deploy-client:
    runs-on: ubuntu-latest
    needs: [build-client, deploy]
    if: needs.deploy.outputs.server_deployed == 'true'
    env:
      SITE_URL: https://streaks.trebeljahr.com
      API_URL: https://streaks.trebeljahr.com
      WRANGLER: wrangler@4
    steps:
      - name: Wait for the server at this commit
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            got=$(curl -fsSL --max-time 10 "$API_URL/api/health?hatchkit_cb=$i$RANDOM" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "✓ server reports $GITHUB_SHA"; exit 0; fi
            echo "  server: ${got:-<no version>} — waiting ($i/40)"
            sleep 15
          done
          echo "::error::the server never reported $GITHUB_SHA on /api/health .version; the client was not switched."
          echo "::error::A server that reports no version needs \`version: process.env.COMMIT_SHA\` on /api/health."
          exit 1

      - name: Switch the client to this commit's Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ needs.build-client.outputs.version_id }}
        run: npx --yes "$WRANGLER" versions deploy "$VERSION_ID@100%" --name streaks-client --message "$GITHUB_SHA" --yes

      - name: Verify the client is live
        run: |
          set -uo pipefail
          for i in $(seq 1 24); do
            body=$(curl -fsSL --max-time 10 "$SITE_URL/version.json?hatchkit_cb=$i$RANDOM" 2>/dev/null || true)
            commit=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              baked=$(printf '%s' "$body" | jq -r '.apiUrl // empty')
              if [ "$baked" != "$API_URL" ]; then
                echo "::error::client is built against '${baked:-<empty>}', expected '$API_URL'"; exit 1
              fi
              echo "✓ $SITE_URL serves $GITHUB_SHA, built against $baked"; exit 0
            fi
            echo "  web: ${commit:-<no response>} — waiting ($i/24)"
            sleep 5
          done
          echo "::error::$SITE_URL/version.json never reported $GITHUB_SHA"; exit 1

  # Always runs, so a half-finished release says which half is live.
  release-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [build-server, build-client, deploy, deploy-client]
    steps:
      - name: Which half is live
        env:
          SERVER: ${{ needs.deploy.result }}
          SERVER_DEPLOYED: ${{ needs.deploy.outputs.server_deployed }}
          CLIENT: ${{ needs.deploy-client.result }}
          VERSION_ID: ${{ needs.build-client.outputs.version_id }}
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$SERVER" != "success" ]; then
            say "::error::Server deploy did not finish ($SERVER). The client was NOT switched: the previous Worker version still serves."
            exit 1
          fi
          if [ "$SERVER_DEPLOYED" != "true" ]; then
            say "Deploys are gated off: nothing went live. Worker version ${VERSION_ID:-<none>} was uploaded, not activated."
            exit 0
          fi
          if [ "$CLIENT" = "success" ]; then
            say "Server and client are both live at $GITHUB_SHA."
            exit 0
          fi
          say "::error::Server $GITHUB_SHA is LIVE. The client is NOT ($CLIENT): the previous Worker version still serves."
          say "To switch by hand: npx wrangler versions deploy ${VERSION_ID:-<id>}@100% --name streaks-client --yes"
          exit 1
